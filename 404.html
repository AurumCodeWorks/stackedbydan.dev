<!DOCTYPE html>
<html lang="en-GB">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>404 — File Not Found | StackedByDan</title>
  <meta name="description" content="404 Error: Page not found. The resource you requested could not be located on StackedByDan." />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="canonical" href="https://stackedbydan.dev/404" />
  <link rel="icon"             type="image/svg+xml" href="favicon.svg" sizes="any" />
  <link rel="icon"             type="image/x-icon"  href="favicon.ico" />
  <link rel="apple-touch-icon" sizes="180x180"      href="apple-touch-icon.png" />
  <link rel="manifest"                              href="site.webmanifest" />
  <link rel="preconnect"    href="https://fonts.googleapis.com" />
  <link rel="preconnect"    href="https://fonts.gstatic.com" crossorigin />
  <link rel="stylesheet"    href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&display=swap" />
  <style>
    :root {
      --green: #00ff41; --blue: #00c8ff;
      --bg: #0a0a0a; --text: #c8c8c8; --dim: #555;
      --font: 'JetBrains Mono', 'Courier New', monospace;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; }
    body {
      background: var(--bg); color: var(--text);
      font-family: var(--font); display: flex;
      align-items: center; justify-content: center;
      text-align: center; padding: 24px;
    }
    canvas {
      position: fixed; inset: 0; z-index: 0;
      opacity: 0.035; pointer-events: none;
    }
    .crt {
      position: fixed; inset: 0; pointer-events: none; z-index: 1;
      background: repeating-linear-gradient(0deg, transparent, transparent 3px, rgba(0,0,0,0.06) 3px, rgba(0,0,0,0.06) 4px);
    }
    .content { position: relative; z-index: 2; max-width: 600px; width: 100%; }
    .err-code {
      font-size: clamp(4rem, 18vw, 8rem); font-weight: 700;
      color: var(--green); line-height: 1;
      text-shadow: 0 0 40px rgba(0,255,65,0.4);
      margin-bottom: 8px;
    }
    .err-label {
      font-size: 0.75rem; color: var(--dim);
      letter-spacing: 0.18em; margin-bottom: 40px;
    }
    .terminal-box {
      background: #0d1117; border: 1px solid rgba(0,255,65,0.18);
      border-radius: 8px; overflow: hidden; margin-bottom: 36px;
      text-align: left;
    }
    .t-bar {
      background: #161b22; padding: 10px 16px;
      display: flex; align-items: center; gap: 7px;
      border-bottom: 1px solid rgba(0,255,65,0.1);
    }
    .dot { width: 11px; height: 11px; border-radius: 50%; }
    .t-body { padding: 20px 24px; font-size: 0.82rem; line-height: 2; }
    .cmd  { color: var(--green); }
    .out  { color: var(--text); padding-left: 2ch; }
    .err  { color: #ff4444; padding-left: 2ch; }
    .dim  { color: var(--dim); }
    .blink {
      display: inline-block; color: var(--green);
      animation: blink 1s step-end infinite;
    }
    @keyframes blink { 0%,100%{opacity:1} 50%{opacity:0} }
    .actions { display: flex; gap: 16px; justify-content: center; flex-wrap: wrap; }
    a.btn {
      display: inline-block; padding: 10px 22px;
      font-family: var(--font); font-size: 0.8rem; font-weight: 700;
      letter-spacing: 0.08em; text-transform: uppercase;
      border-radius: 6px; text-decoration: none;
      transition: all 0.3s ease;
    }
    .btn-primary {
      color: var(--green); border: 1px solid var(--green); background: transparent;
    }
    .btn-primary:hover { background: var(--green); color: #000; box-shadow: 0 0 12px rgba(0,255,65,0.6); }
    .btn-ghost {
      color: var(--text); border: 1px solid rgba(0,255,65,0.18); background: transparent;
    }
    .btn-ghost:hover { border-color: var(--green); color: var(--green); }
  </style>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-F1EDPQS4Q8"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    
    // Set default consent dynamically based on local storage
    const consent = localStorage.getItem('cookie-consent') === 'accepted' ? 'granted' : 'denied';
    gtag('consent', 'default', {
      'analytics_storage': consent,
      'ad_storage': consent
    });

    gtag('js', new Date());
    gtag('config', 'G-F1EDPQS4Q8');
  </script>
</head>
<body>
  <canvas id="c" aria-hidden="true"></canvas>
  <div class="crt" aria-hidden="true"></div>

  <div class="content">
    <div class="err-code">404</div>
    <div class="err-label">ERROR: FILE_NOT_FOUND</div>

    <div class="terminal-box">
      <div class="t-bar">
        <div class="dot" style="background:#ff5f57"></div>
        <div class="dot" style="background:#febc2e"></div>
        <div class="dot" style="background:#28c840"></div>
      </div>
      <div class="t-body">
        <div class="cmd">C:\stackedbydan&gt; GET <span id="current-path" style="color:var(--blue)">/</span></div>
        <div class="err">FATAL: No such file or directory.</div>
        <div class="out">The page you're looking for doesn't exist</div>
        <div class="out">or may have been moved.</div>
        <div class="dim">&nbsp;</div>
        <div class="cmd">C:\stackedbydan&gt; <span class="blink">_</span></div>
      </div>
    </div>

    <div class="actions">
      <a href="/" class="btn btn-primary">[ ./go_home.sh ]</a>
      <a href="/#contact" class="btn btn-ghost">[ ./contact.sh ]</a>
    </div>
  </div>

  <script>
    const c = document.getElementById('c');
    const ctx = c.getContext('2d');
    const CHARS = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789@#$%^&*()';
    const FS = 14;
    let cols, drops;
    function resize() {
      c.width = window.innerWidth; c.height = window.innerHeight;
      cols = Math.floor(c.width / FS); drops = Array(cols).fill(1);
    }
    function draw() {
      ctx.fillStyle = 'rgba(10,10,10,0.04)'; ctx.fillRect(0,0,c.width,c.height);
      ctx.fillStyle = '#00ff41'; ctx.font = FS + 'px monospace';
      for (let i = 0; i < drops.length; i++) {
        ctx.fillText(CHARS[Math.floor(Math.random()*CHARS.length)], i*FS, drops[i]*FS);
        if (drops[i]*FS > c.height && Math.random() > 0.975) drops[i] = 0;
        drops[i]++;
      }
    }
    resize();
    window.addEventListener('resize', resize);
    setInterval(draw, 50);

    // Dynamic path insertion
    document.getElementById('current-path').textContent = window.location.pathname;
  </script>
  <script src="/js/main.js?v=20261013d"></script>
</body>
</html>
