<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;700&amp;display=swap');
      text { font-family: 'JetBrains Mono', 'Courier New', monospace; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="#0a0a0a"/>

  <!-- Grid lines subtle -->
  <g stroke="#1a1a1a" stroke-width="1">
    <line x1="0" y1="210" x2="1200" y2="210"/>
    <line x1="0" y1="420" x2="1200" y2="420"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
  </g>

  <!-- Top accent bar -->
  <rect width="1200" height="4" fill="#00ff41"/>

  <!-- Terminal window chrome -->
  <rect x="60" y="60" width="1080" height="510" rx="8" fill="#0d1117" stroke="#1e2530" stroke-width="1"/>

  <!-- Titlebar -->
  <rect x="60" y="60" width="1080" height="48" rx="8" fill="#161b22"/>
  <rect x="60" y="88" width="1080" height="20" fill="#161b22"/>

  <!-- Traffic lights -->
  <circle cx="94" cy="84" r="8" fill="#ff5f56"/>
  <circle cx="118" cy="84" r="8" fill="#ffbd2e"/>
  <circle cx="142" cy="84" r="8" fill="#27c93f"/>

  <!-- Title bar text -->
  <text x="600" y="89" text-anchor="middle" fill="#6e7681" font-size="14">stackedbydan@dev: ~</text>

  <!-- Terminal content -->
  <text x="100" y="160" fill="#6e7681" font-size="18">$&gt;</text>
  <text x="130" y="160" fill="#00ff41" font-size="18" font-weight="700">whoami</text>

  <!-- Main headline -->
  <text x="100" y="230" fill="#e6edf3" font-size="42" font-weight="700">stackedbydan<tspan fill="#00ff41">.dev</tspan></text>

  <!-- Tagline -->
  <text x="100" y="285" fill="#8b949e" font-size="20">UK web developer &amp; Cloudflare specialist</text>

  <!-- Divider -->
  <line x1="100" y1="315" x2="900" y2="315" stroke="#1e2530" stroke-width="1"/>

  <!-- Key stats -->
  <text x="100" y="365" fill="#6e7681" font-size="15">PACKAGES FROM</text>
  <text x="100" y="400" fill="#00ff41" font-size="32" font-weight="700">£249</text>

  <text x="380" y="365" fill="#6e7681" font-size="15">HAND-CODED</text>
  <text x="380" y="400" fill="#00c8ff" font-size="24" font-weight="700">HTML · CSS · JS</text>

  <text x="700" y="365" fill="#6e7681" font-size="15">BUILT ON</text>
  <text x="700" y="400" fill="#e6edf3" font-size="24" font-weight="700">Workers · Pages · D1 · R2</text>

  <!-- Bottom status line -->
  <text x="100" y="490" fill="#6e7681" font-size="16">STATUS</text>
  <text x="100" y="520" fill="#00ff41" font-size="18">● TAKING ON PROJECTS — free quote within 24h</text>

  <!-- Cursor -->
  <rect x="100" y="535" width="12" height="22" fill="#00ff41" opacity="1"/>

  <!-- Right side accent -->
  <rect x="1100" y="60" width="40" height="510" rx="4" fill="#0d1117"/>
  <text x="1120" y="350" fill="#1e2530" font-size="11" text-anchor="middle" transform="rotate(90, 1120, 350)">NO WORDPRESS · NO PLUGINS · NO BLOAT</text>
</svg>
